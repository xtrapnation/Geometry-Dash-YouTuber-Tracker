name: Update YouTube stats

on:
  schedule:
    - cron: '17 6 * * *'   # every day at 06:17 UTC — change to taste (crontab.guru)
  workflow_dispatch:         # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write            # lets the job commit the backup file

concurrency: update-stats    # never run two at once

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch stats and save to Firestore
        run: node scripts/update-stats.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          BACKUP_PATH: backups/tracker-data.json

      - name: Commit backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups/tracker-data.json
          git diff --cached --quiet || git commit -m "Stats update $(date -u +%Y-%m-%d)"
          git push
